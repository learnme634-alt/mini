    function showFinal(){
      wrap.innerHTML='';
      const attemptsP2Guessing = results[0]; // محاولات اللاعب الثاني وهو يخمن رقم اللاعب الأول
      const attemptsP1Guessing = results[1]; // محاولات اللاعب الأول وهو يخمن رقم اللاعب الثاني
      let msg;
      if(attemptsP1Guessing<attemptsP2Guessing) msg='🏆 فاز اللاعب الأول! خمن بمحاولات أقل';
      else if(attemptsP2Guessing<attemptsP1Guessing) msg='🏆 فاز اللاعب الثاني! خمن بمحاولات أقل';
      else msg='🤝 تعادل! نفس عدد المحاولات';

      const box=document.createElement('div'); box.style.textAlign='center';
      box.innerHTML = `<div style="font-size:40px;margin-bottom:8px">🏁</div>
        <div style="font-weight:bold;font-size:19px;margin-bottom:12px">${msg}</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:6px">
          <div style="background:rgba(78,205,196,0.18);border:2px solid #4ecdc4;border-radius:14px;padding:10px 16px">
            <div style="font-size:12px;opacity:.85">🅰️ اللاعب الأول</div>
            <div style="font-size:22px;font-weight:900;color:#4ecdc4">${attemptsP1Guessing} محاولة</div>
          </div>
          <div style="background:rgba(255,107,107,0.18);border:2px solid #ff6b6b;border-radius:14px;padding:10px 16px">
            <div style="font-size:12px;opacity:.85">🅱️ اللاعب الثاني</div>
            <div style="font-size:22px;font-weight:900;color:#ff6b6b">${attemptsP2Guessing} محاولة</div>
          </div>
        </div>`;
      const b1=document.createElement('button'); b1.className='actionBtn'; b1.textContent='🔁 مباراة جديدة';
      b1.style.marginTop='14px';
      b1.addEventListener('click', ()=>{ sfx('click'); results=[null,null]; startRound(1); });
      const b2=document.createElement('button'); b2.className='actionBtn secondary'; b2.textContent='🏠 القائمة';
      b2.addEventListener('click', ()=>{ sfx('click'); backBtn.click(); });
      box.appendChild(document.createElement('br'));
      box.appendChild(b1); box.appendChild(b2);
      wrap.appendChild(box);
      setStats('');
    }

    showIntro();
    return ()=>{};
  }

  /* =========================================================
     UNO — لعبة بطاقات أونلاين لشخصين
     قواعد UNO القياسية: مطابقة اللون/الرقم/الرمز، +2، تخطي، عكس، وايلد، +4.
  ========================================================= */
  function initUno(container, statsEl){
    let destroyed=false, peer=null, roomCode='', isHost=false;
    let conn=null, myId=null, myName='أنت';
    const peers={};
    const MAX_PLAYERS=8, COLORS=['red','yellow','green','blue'];
    const COLOR_NAMES={red:'أحمر',yellow:'أصفر',green:'أخضر',blue:'أزرق'};
    const COLOR_CLASS={red:'unoRed',yellow:'unoYellow',green:'unoGreen',blue:'unoBlue',wild:'unoWild'};
    const SYMBOL={skip:'⊘',reverse:'↔',draw2:'+2',wild:'★',wild4:'+4'};
    let state=null, turnToken=0;

    function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
    function clear(){container.innerHTML='';}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function send(msg){if(conn&&conn.open){try{conn.send(msg)}catch(e){}}}
    function sendTo(id,msg){if(peers[id]&&peers[id].conn&&peers[id].conn.open){try{peers[id].conn.send(msg)}catch(e){}}}
    function broadcast(msg){Object.keys(peers).forEach(id=>sendTo(id,msg))}
    function allPlayerIds(){return state?state.players.map(p=>p.id):[]}
    function playerName(id){const p=state?.players.find(x=>x.id===id);return p?.name||id}
    function nextId(id,steps=1){if(!state)return id;const ids=allPlayerIds(),i=ids.indexOf(id);if(i<0)return id;let n=(i+state.direction*steps)%ids.length;if(n<0)n+=ids.length;return ids[n]}
    function makeDeck(){
      const d=[];let id=0;
      for(const c of COLORS){
        d.push({id:id++,color:c,value:0});
        for(let n=1;n<=9;n++){d.push({id:id++,color:c,value:n});d.push({id:id++,color:c,value:n})}
        for(const v of ['skip','reverse','draw2']){d.push({id:id++,color:c,value:v});d.push({id:id++,color:c,value:v})}
      }
      for(let i=0;i<4;i++){d.push({id:id++,color:'wild',value:'wild'});d.push({id:id++,color:'wild',value:'wild4'})}
      return shuffle(d);
    }
    function cardLabel(c){return typeof c.value==='number'?String(c.value):SYMBOL[c.value]||'?'}
    function cardHTML(c,opts={}){
      const playable=!!opts.playable, disabled=!!opts.disabled;
      const cls='unoCard '+(COLOR_CLASS[c.color]||'unoWild')+(playable?' playable':'')+(disabled?' disabled':'');
      const label=esc(cardLabel(c));
      return '<div class="'+cls+'" data-card-id="'+c.id+'"><div class="unoCardShine"></div><span class="oval"></span><span class="mini">'+label+'</span><span class="symbol">'+label+'</span><span class="mini2">'+label+'</span></div>';
    }
    function makeState(){
    const deck=makeDeck(),hands={};
    state.players.forEach(p=>hands[p.id]=[]);
    for(let r=0;r<7;r++)state.players.forEach(p=>hands[p.id].push(deck.pop()));
    let top=deck.pop();
    while(top.color==='wild'){deck.unshift(top);top=deck.pop()}
    
    // التعديل هنا: تم إضافة players و الحفاظ على حالة scores عبر الجولات
    return {
      players: state.players, 
      deck,
      discard:[top],
      hands,
      currentColor:top.color,
      turn:state.players[0].id,
      direction:1,
      pendingDraw:0,
      uno:{},
      scores: state.scores || {}, 
      round:state?.round||1
    };
  }
    function ensureDeck(){
      if(state.deck.length)return true;
      if(state.discard.length<=1)return false;
      const top=state.discard[state.discard.length-1];const rest=shuffle(state.discard.slice(0,-1));state.discard=[top];state.deck=rest;return true;
    }
    function drawCards(id,n){const out=[];for(let i=0;i<n;i++){if(!ensureDeck())break;out.push(state.deck.pop());state.hands[id].push(out[out.length-1])}state.uno[id]=false;return out}
    function isPlayable(c){if(!state)return false;if(state.pendingDraw)return false;const top=state.discard[state.discard.length-1];return c.color==='wild'||c.color===state.currentColor||c.value===top.value}
    function scoreRound(winner){
      let pts=0;state.players.forEach(p=>{if(p.id===winner)return;state.hands[p.id].forEach(c=>{if(typeof c.value==='number')pts+=c.value;else if(['skip','reverse','draw2'].includes(c.value))pts+=20;else pts+=50})});state.scores[winner]=(state.scores[winner]||0)+pts;return pts;
    }
   function sanitize(forId){
      const hands={};
      state.players.forEach(p=>hands[p.id]=p.id===forId?state.hands[p.id]:state.hands[p.id].map(()=>({back:true})));
      return {
        players: state.players,
        deck: { length: state.deck.length }, 
        discard: [state.discard[state.discard.length-1]],
        hands,
        currentColor: state.currentColor,
        turn: state.turn,
        direction: state.direction,
        pendingDraw: state.pendingDraw,
        uno: state.uno,
        scores: state.scores,
        round: state.round
      };
    }
    function sendStates(){
      if(!state)return;send({type:'state',state:sanitize('A')});Object.keys(peers).forEach(id=>sendTo(id,{type:'state',state:sanitize(id)}));render();
    }
    function toast(text,kind='normal'){const old=container.querySelector('.unoToast');if(old)old.remove();const t=document.createElement('div');t.className='unoToast '+kind;t.textContent=text;container.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),220)},1500)}
    function animateCardToCenter(cardId){const el=container.querySelector('[data-card-id="'+cardId+'"]');const target=container.querySelector('.unoDiscard');if(!el||!target)return;const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();const fly=document.createElement('div');fly.className='unoFlyCard';fly.innerHTML=el.outerHTML;document.body.appendChild(fly);fly.style.left=a.left+'px';fly.style.top=a.top+'px';fly.style.width=a.width+'px';fly.style.height=a.height+'px';requestAnimationFrame(()=>{fly.style.transform='translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) rotate('+(Math.random()*16-8)+'deg) scale(.94)';fly.style.opacity='0'});setTimeout(()=>fly.remove(),520)}
    function pulseTurn(){const t=container.querySelector('.unoTurnRing');if(t){t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}}
    function startRound(){
      state=makeState();state.players.forEach(p=>{state.scores[p.id]=state.scores[p.id]||0;state.uno[p.id]=false});
      const first=state.discard[0];
      if(first.value==='skip')state.turn=nextId(state.turn);
      else if(first.value==='reverse')state.direction=-1;
      else if(first.value==='draw2'){state.pendingDraw=2;state.turn=nextId(state.turn)}
      else if(first.value==='wild'||first.value==='wild4')state.currentColor=COLORS[Math.floor(Math.random()*4)];
      sendStates();toast('🔥 الجولة '+state.round+' بدأت!');
    }
    function chooseColor(cb){
      const o=document.createElement('div');o.className='unoColorPicker';o.innerHTML='<div class="unoColorBox"><h3>🎨 اختَر اللون</h3><div class="unoColors"></div></div>';
      const g=o.querySelector('.unoColors');COLORS.forEach(c=>{const b=document.createElement('button');b.className='unoColorBtn '+COLOR_CLASS[c];b.textContent=COLOR_NAMES[c];b.onclick=()=>{o.remove();cb(c)};g.appendChild(b)});container.appendChild(o);
    }
    function hostPlay(id,cardId,color){
      if(!state||state.turn!==id)return;
      const hand=state.hands[id],idx=hand.findIndex(c=>c.id===cardId);if(idx<0)return;const card=hand[idx];
      if(!isPlayable(card))return;
      if(card.value==='wild4'&&hand.some(c=>c.id!==card.id&&c.color===state.currentColor)){sendTo(id,{type:'error',text:'لا يمكنك استخدام +4 ولديك كارت من اللون الحالي.'});return}
      if((card.value==='wild'||card.value==='wild4')&&!COLORS.includes(color)){sendTo(id,{type:'needColor'});return}
      hand.splice(idx,1);state.discard.push(card);state.currentColor=card.color==='wild'?color:card.color;state.uno[id]=false;
      if(hand.length===0){const pts=scoreRound(id);sendStates();broadcast({type:'roundOver',winner:id,pts,scores:state.scores});finishOverlay(id,pts);return}
      if(card.value==='skip')state.turn=nextId(id,2);
      else if(card.value==='reverse')state.turn=nextId(id,state.players.length===2?2:1);
      else {state.turn=nextId(id);if(card.value==='draw2')state.pendingDraw=2;else if(card.value==='wild4')state.pendingDraw=4;else state.pendingDraw=0}
      if(state.pendingDraw&&card.value!=='draw2'&&card.value!=='wild4')state.pendingDraw=0;
      sendStates();animateCardToCenter(card.id);pulseTurn();playSfx(card.value==='draw2'||card.value==='wild4'?'hit':'pop');
    }
    function playCard(id){
      if(!state||state.turn!==myId)return;const c=state.hands[myId]?.find(x=>x.id===id);if(!c||!isPlayable(c))return;
      if(c.value==='wild'||c.value==='wild4')chooseColor(color=>{if(isHost)hostPlay(myId,id,color);else send({type:'play',cardId:id,color})});else if(isHost)hostPlay(myId,id,null);else send({type:'play',cardId:id,color:null});
    }
    function drawAction(){
      if(!state||state.turn!==myId)return;
      if(isHost)hostDraw(myId);else send({type:'draw'});
    }
    function hostDraw(id){
      if(!state||state.turn!==id)return;
      const n=state.pendingDraw||1;
      const drawn=drawCards(id,n);
      state.pendingDraw=0;
      
      // تم مسح السطر ( state.turn=nextId(id); ) حتى ما ينتقل الدور للثاني إجبارياً
      // هسه اللاعب يسحب ويبقى الدور عنده حتى يلعب
      
      sendStates();
      toast(n>1?'😵 اسحب '+n+' كروت':'🃏 سحبت كارت');
      playSfx('flip');
    }
    function callUno(){if(!state||state.hands[myId]?.length!==1)return;if(isHost){state.uno[myId]=true;sendStates();toast('🔥 UNO!','hot');playSfx('win')}else{send({type:'uno'});toast('🔥 UNO!','hot')}}
    function render(){
      if(!state||destroyed)return;clear();
      const me=state.hands[myId]||[],ids=state.players.map(p=>p.id),oppIds=ids.filter(id=>id!==myId),top=state.discard[state.discard.length-1];
      const wrap=document.createElement('div');wrap.className='unoWrap';
      const table=document.createElement('div');table.className='unoTable';
      const ring=document.createElement('div');ring.className='unoTurnRing';table.appendChild(ring);
      const players=document.createElement('div');players.className='unoPlayersAround';
      oppIds.forEach((id,i)=>{const p=state.players.find(x=>x.id===id);const box=document.createElement('div');box.className='unoPlayer '+(state.turn===id?'active':'')+' seat'+(i%6);box.innerHTML='<div class="avatar">'+esc((p.name||'لاعب').slice(0,1))+'</div><div class="name">'+esc(p.name)+'</div><div class="count">🃏 '+state.hands[id].length+'</div><div class="unoTinyBar"><span style="width:'+Math.min(100,state.hands[id].length*10)+'%"></span></div>';players.appendChild(box)});table.appendChild(players);
      const center=document.createElement('div');center.className='unoCenter';
      const draw=document.createElement('div');draw.className='unoPile unoDraw';draw.innerHTML='<div class="unoBackFace"><span>UNO</span></div><span class="unoDeckLabel">'+state.deck.length+'</span>';draw.onclick=drawAction;center.appendChild(draw);
      const disc=document.createElement('div');disc.className='unoPile unoDiscard '+(COLOR_CLASS[top.color]||'unoWild');disc.innerHTML=cardHTML(top).replace(/^<div[^>]*>/,'<div class="cardInner">');center.appendChild(disc);table.appendChild(center);
      const turnText=state.turn===myId?'🎯 دورك': '⏳ دور '+esc(playerName(state.turn));
      const status=document.createElement('div');status.className='unoStatus';status.innerHTML='<b>'+turnText+'</b><span>اللون الحالي: '+COLOR_NAMES[state.currentColor]+'</span>';table.appendChild(status);
      const info=document.createElement('div');info.className='unoRoundInfo';info.innerHTML='الجولة '+state.round+' • '+state.players.length+' لاعبين • اتجاه '+(state.direction===1?'↻':'↺');table.appendChild(info);
      const actions=document.createElement('div');actions.className='unoActions';
      const db=document.createElement('button');db.className='unoBtn primary';db.textContent=state.pendingDraw?'🃏 اسحب +'+state.pendingDraw:'🃏 اسحب كارت';db.disabled=state.turn!==myId;db.onclick=drawAction;actions.appendChild(db);
      const ub=document.createElement('button');ub.className='unoBtn red';ub.textContent='🔥 UNO!';ub.disabled=me.length!==1;ub.onclick=callUno;actions.appendChild(ub);
      table.appendChild(actions);
      const hand=document.createElement('div');hand.className='unoHand';me.forEach((c,i)=>{const holder=document.createElement('div');holder.className='unoHandSlot';holder.style.setProperty('--i',i);holder.innerHTML=cardHTML(c,{playable:state.turn===myId&&isPlayable(c),disabled:state.turn!==myId||!isPlayable(c)});const el=holder.firstElementChild;el.onclick=()=>playCard(c.id);hand.appendChild(holder)});table.appendChild(hand);
      const score=document.createElement('div');score.className='unoScoreboard';state.players.forEach(p=>{const s=document.createElement('span');s.innerHTML='<b>'+esc(p.name)+'</b> '+(state.scores[p.id]||0);score.appendChild(s)});table.appendChild(score);
      wrap.appendChild(table);container.appendChild(wrap);statsEl.textContent='أونو • '+state.players.length+' لاعبين • الجولة '+state.round;
      setTimeout(()=>pulseTurn(),30);
    }
    function finishOverlay(winner,pts){
      render();const o=document.createElement('div');o.className='unoOverlay';o.innerHTML='<div class="unoOverlayBox winBox"><div class="winBurst">🏆</div><h2>'+esc(playerName(winner))+' فاز!</h2><p>حصل على <b>'+pts+'</b> نقطة في هذه الجولة.</p><div class="winScores">'+state.players.map(p=>'<span>'+esc(p.name)+'<b>'+(state.scores[p.id]||0)+'</b></span>').join('')+'</div><button class="actionBtn">🔁 جولة جديدة</button><button class="actionBtn secondary">🏠 القائمة</button></div>';
      o.querySelector('.actionBtn').onclick=()=>{o.remove();if(isHost){state.round++;startRound()}else send({type:'newRound'})};o.querySelector('.secondary').onclick=()=>{o.remove();backBtn.click()};container.querySelector('.unoWrap').appendChild(o);playSfx('win');

  function pkComputeOutcome(shot, dive){
    if(shot.wide) return { scored:false, reason:'wide' };
    if(shot.chip){
      if(dive==='mid') return { scored: Math.random()>=0.72, reason: Math.random()>=0.72?'goal':'save' };
      return { scored:true, reason:'goal' };
    }
    const zone = shot.tx<0.38 ? 'left' : (shot.tx>0.62 ? 'right' : 'mid');
    const corner = shot.ty>0.72;
    let saveChance;
    if(dive===zone) saveChance = 0.62 - shot.power*0.32 - (corner?0.22:0) - (zone==='mid'?0.1:0);
    else if(dive==='mid') saveChance = 0.12 - shot.power*0.08;
    else saveChance = 0.05;
    saveChance = Math.max(0.03, Math.min(0.9, saveChance));
    const scored = Math.random() >= saveChance;
    return { scored, reason: scored?'goal':'save' };
  }

  function pkAiShot(){
    return {
      tx: Math.random(),
      ty: 0.3 + Math.random()*0.65,
      power: 0.5 + Math.random()*0.5,
      chip: Math.random()<0.08,
      wide: Math.random()<0.06
    };
  }
  function pkAiDive(){
    const r = Math.random();
    return r<0.38 ? 'left' : (r<0.76 ? 'right' : 'mid');
  }

      const grid=document.createElement('div'); grid.className='teamGrid';
      TEAMS.forEach(t=>{
        const c=document.createElement('div'); c.className='teamCard';
        c.innerHTML = '<span class="tFlag">'+t.emoji+'</span><span class="tName">'+t.name+'</span><span class="tStar">⭐ '+t.star+'</span>';
        c.addEventListener('click', ()=>{
          sfx('click'); teamB=t;
          send({ type:'ready', team:t });
          clear();
          const w=document.createElement('div'); w.className='pkMenu';
          w.innerHTML = '<h2>⏳ بانتظار المضيف...</h2><p class="pkSub">اخترت '+t.name+'</p>';
          container.appendChild(w);
        });
        grid.appendChild(c);
      });
      wrap.appendChild(grid);
      container.appendChild(wrap);
    }

    function send(msg){ if(conn && conn.open){ try{ conn.send(msg); }catch(e){} } }

    function handleMessage(msg){
      if(!msg || !msg.type) return;
      if(isHost){
        if(msg.type==='ready'){
          teamB = msg.team;
          labelA = teamA.name; labelB = teamB.name;
          send({ type:'start', teamA, teamB });
          buildStage();
          setTimeout(runTurn, 600);
        } else if(msg.type==='shotInput'){
          if(pendingResolvers.shot){ const f=pendingResolvers.shot; pendingResolvers.shot=null; f(msg.shot); }
        } else if(msg.type==='diveInput'){
          if(pendingResolvers.dive){ const f=pendingResolvers.dive; pendingResolvers.dive=null; f(msg.dive); }
        }
      } else {
        if(msg.type==='start'){
          teamA=msg.teamA; teamB=msg.teamB; labelA=teamA.name; labelB=teamB.name;
          buildStage();
        } else if(msg.type==='yourTurnKick'){
          showKickerUI('أنت', shot=> send({ type:'shotInput', shot }));
        } else if(msg.type==='yourTurnDefend'){
          showDefendUI('أنت', dive=> send({ type:'diveInput', dive }));
        } else if(msg.type==='kickResult'){
          scoreA=msg.scoreA; scoreB=msg.scoreB; attemptsA=msg.attemptsA; attemptsB=msg.attemptsB; dotsA=msg.dotsA; dotsB=msg.dotsB;
          updateHud();
          animateAndShow(msg.shot, msg.dive, msg.scored, msg.kSide, ()=>{});
        } else if(msg.type==='matchOver'){
          scoreA=msg.scoreA; scoreB=msg.scoreB; matchOver=true;
          setTimeout(()=> showFinal(msg.winner), 700);
        }
      }
    }

    /* ---------- match stage ---------- */
    function buildStage(){
      clear();
      const wrap=document.createElement('div'); wrap.className='pkWrap';
      const hud=document.createElement('div'); hud.className='pkHud'; hud.id='pkHud';
      wrap.appendChild(hud);
      const stage=document.createElement('div'); stage.className='pkStage'; stage.id='pkStage';
      stage.innerHTML =
        '<div class="pkField"></div>'+
        '<div class="pkGoal"></div>'+
        '<div class="pkSpotHint"></div>'+
        '<div class="pkKeeper" id="pkKeeper">🧤</div>'+
        '<div class="pkBall" id="pkBall">⚽</div>'+
        '<div class="pkBanner" id="pkBanner"></div>'+
        '<div class="pkTimerWrap" id="pkTimerWrap" style="display:none"><div class="pkTimerBar" id="pkTimerBar"></div></div>';
      wrap.appendChild(stage);
      container.appendChild(wrap);
      kickIndex=0; scoreA=0; scoreB=0; attemptsA=0; attemptsB=0; dotsA=[]; dotsB=[]; matchOver=false;
      updateHud();
    }

    function updateHud(){
      const hud=document.getElementById('pkHud'); if(!hud) return;
      function dotsHtml(arr){
        let h=''; for(let i=0;i<5;i++){ const d=arr[i]; h+='<span class="pkDot '+(d==='goal'?'goal':(d==='miss'?'miss':''))+'"></span>'; }
        return h;
      }
      hud.innerHTML =
        '<div class="pkHudSide"><div class="pkTeamLbl">'+teamA.emoji+' '+labelA+'</div><div class="pkDots">'+dotsHtml(dotsA)+'</div><div style="font-weight:900">'+scoreA+'</div></div>'+
        '<div class="pkVs">VS</div>'+
        '<div class="pkHudSide"><div class="pkTeamLbl">'+teamB.emoji+' '+labelB+'</div><div class="pkDots">'+dotsHtml(dotsB)+'</div><div style="font-weight:900">'+scoreB+'</div></div>';
    }

    function setBanner(text, color){ const b=document.getElementById('pkBanner'); if(b){ b.textContent=text; b.style.color=color||'#ffd93b'; } }
    function clearControlZone(){
      const stage=document.getElementById('pkStage'); if(!stage) return;
      stage.querySelectorAll('.pkTouchPad,.pkCtrlRow,.pkDiveRow').forEach(el=>el.remove());
    }
    function resetBallKeeper(){
      const ball=document.getElementById('pkBall'), keeper=document.getElementById('pkKeeper');
      if(ball){ ball.style.left='50%'; ball.style.bottom='14%'; ball.style.transform='translate(-50%,0) scale(1)'; }
      if(keeper){ keeper.style.left='50%'; keeper.style.transform='translate(-50%,0)'; }
    }

    function showKickerUI(labelText, onShot){
      if(destroyed) return;
      clearControlZone();
      setBanner('🎯 دور '+labelText+' — سدد!', '#4ade80');
      resetBallKeeper();
      buildShootControls(onShot);
    }

    function buildShootControls(onShot){
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const pad=document.createElement('div'); pad.className='pkTouchPad';
      const ctrlRow=document.createElement('div'); ctrlRow.className='pkCtrlRow';
      let used=false, dragging=false, sx=0, sy=0, st=0;
      function finish(shot){ if(used) return; used=true; pad.remove(); ctrlRow.remove(); onShot(shot); }

      pad.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; sy=e.clientY; st=performance.now(); try{ pad.setPointerCapture(e.pointerId); }catch(err){} });
      pad.addEventListener('pointerup', e=>{
        if(!dragging) return; dragging=false;
        const dx=e.clientX-sx, dyF=sy-e.clientY, dt=Math.max(16, performance.now()-st);
        if(dyF<15) return;
        const dist=Math.hypot(dx,dyF), speed=dist/dt;
        let tx=0.5+dx/140, ty=Math.min(1, dyF/160);
        const power=Math.max(0.15, Math.min(1, speed/0.9));
        const chip = speed<0.15 && dyF<95 && dyF>20 && Math.abs(dx)<40;
        const wide = tx<-0.06 || tx>1.06;
        tx=Math.max(-0.12, Math.min(1.12, tx));
        sfx('click');
        finish({ tx, ty, power, chip, wide });
      });
      stage.appendChild(pad);

      const switchBtn=document.createElement('button'); switchBtn.className='pkSwitchBtn';
      switchBtn.textContent = controlScheme==='swipe' ? '🕹️ استخدم دائرة الاتجاهات' : '👆 استخدم السحب باللمس';
      switchBtn.addEventListener('click', ()=>{ controlScheme = controlScheme==='swipe' ? 'dial' : 'swipe'; pad.remove(); ctrlRow.remove(); buildShootControls(onShot); });
      ctrlRow.appendChild(switchBtn);

      if(controlScheme==='dial'){
        pad.style.pointerEvents='none';
        dialPick=null; chipOn=false;
        const dial=document.createElement('div'); dial.className='pkDial';
        const cells=[
          {x:0,y:0,tx:0.15,ty:0.85,icon:'↖️'},{x:52,y:0,tx:0.5,ty:0.9,icon:'⬆️'},{x:104,y:0,tx:0.85,ty:0.85,icon:'↗️'},
          {x:0,y:52,tx:0.15,ty:0.25,icon:'↙️'},{x:52,y:52,tx:0.5,ty:0.3,icon:'⬇️'},{x:104,y:52,tx:0.85,ty:0.25,icon:'↘️'}
        ];
        cells.forEach(c=>{
          const cell=document.createElement('div'); cell.className='pkDialCell'; cell.style.left=c.x+'px'; cell.style.top=c.y+'px'; cell.textContent=c.icon;
          cell.addEventListener('click', ()=>{
            dial.querySelectorAll('.pkDialCell').forEach(x=>x.classList.remove('picked'));
            cell.classList.add('picked'); dialPick={ tx:c.tx, ty:c.ty };
          });
          dial.appendChild(cell);
        });
        ctrlRow.appendChild(dial);
        const chipBtn=document.createElement('button'); chipBtn.className='pkChipToggle'; chipBtn.textContent='🪁 بانينكا';
        chipBtn.addEventListener('click', ()=>{ chipOn=!chipOn; chipBtn.classList.toggle('on', chipOn); });
        ctrlRow.appendChild(chipBtn);
        let holding=false, holdStart=0;
        const shootBtn=document.createElement('button'); shootBtn.className='pkShootBtn'; shootBtn.textContent='🔫 اضغط مطول للتسديد';
        shootBtn.addEventListener('pointerdown', ()=>{ holding=true; holdStart=performance.now(); });
        const release=()=>{
          if(!holding) return; holding=false;
          const dur=performance.now()-holdStart;
          const power=Math.max(0.2, Math.min(1, dur/900));
          const pick = dialPick || { tx:0.5, ty:0.5 };
          sfx('click');
          finish({ tx:pick.tx, ty: chipOn?0.5:pick.ty, power: chipOn?0.35:power, chip: chipOn, wide:false });
        };
        shootBtn.addEventListener('pointerup', release);
        shootBtn.addEventListener('pointerleave', ()=>{ holding=false; });
        ctrlRow.appendChild(shootBtn);
      } else {
        const hint=document.createElement('div');
        hint.style.cssText='color:#fff;opacity:.9;font-size:12px;text-align:center;max-width:260px;background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:12px;';
        hint.textContent='اسحب إصبعك من عند الكرة للأعلى باتجاه المرمى — سرعة السحب = قوة التسديدة، اسحب بخفة وبثبات لعمل بانينكا 🪁';
        ctrlRow.appendChild(hint);
      }
      stage.appendChild(ctrlRow);
    }

    function showDefendUI(labelText, onDive){
      if(destroyed) return;
      clearControlZone();
      setBanner('🧤 دور '+labelText+' — صد الكرة!', '#f87171');
      resetBallKeeper();
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const timerWrap=document.getElementById('pkTimerWrap'), timerBar=document.getElementById('pkTimerBar');
      timerWrap.style.display='block'; timerBar.style.transition='none'; timerBar.style.width='100%';
      requestAnimationFrame(()=>{ timerBar.style.transition='width 1.8s linear'; timerBar.style.width='0%'; });
      const row=document.createElement('div'); row.className='pkDiveRow';
      let done=false;
      function finish(dive){ if(done) return; done=true; clearTimeout(autoT); timerWrap.style.display='none'; row.remove(); onDive(dive); }
      [{d:'left',icon:'⬅️'},{d:'mid',icon:'🧤'},{d:'right',icon:'➡️'}].forEach(o=>{
        const b=document.createElement('button'); b.className='pkDiveBtn'; b.textContent=o.icon;
        b.addEventListener('click', ()=>{ sfx('click'); finish(o.d); });
        row.appendChild(b);
      });
      stage.appendChild(row);
      const autoT=setTimeout(()=> finish('mid'), 1850);
    }

    function showPassDevice(lbl, kind, next){
      clearControlZone();
      setBanner('', '#fff');
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const row=document.createElement('div'); row.className='pkCtrlRow';
      const box=document.createElement('div'); box.style.cssText='background:rgba(0,0,0,0.55);padding:16px 20px;border-radius:16px;text-align:center;';
      box.innerHTML = '<div style="font-size:15px;margin-bottom:10px">🔄 مرر الجهاز... دور <b>'+lbl+'</b> '+(kind==='shot'?'للتسديد ⚽':'للصد 🧤')+'</div>';
      const b=document.createElement('button'); b.className='actionBtn'; b.textContent='✅ جاهز';
      b.addEventListener('click', ()=>{ sfx('click'); row.remove(); next(); });
      box.appendChild(b); row.appendChild(box);
      stage.appendChild(row);
    }

    function animateAndShow(shot, dive, scored, kSide, cb){
      if(destroyed) return;
      clearControlZone();
      const ball=document.getElementById('pkBall'), keeper=document.getElementById('pkKeeper');
      const timerWrap=document.getElementById('pkTimerWrap'); if(timerWrap) timerWrap.style.display='none';
      const kickerLabel = kSide==='A' ? labelA : labelB;
      setBanner('⚽ '+kickerLabel+' يسدد...', '#ffd93b');
      const keeperOffset = dive==='left' ? -78 : (dive==='right' ? 78 : 0);
      if(keeper) keeper.style.transform = 'translate(calc(-50% + '+keeperOffset+'px), '+(dive==='mid'?0:6)+'px) rotate('+(dive==='left'?-18:(dive==='right'?18:0))+'deg)';
      const tx = shot.wide ? (shot.tx<0.5 ? -0.15 : 1.15) : Math.max(-0.15, Math.min(1.15, shot.tx));
      const ty = shot.chip ? 0.5 : shot.ty;
      const leftPct = 11 + tx*78;
      const bottomPct = 58 + ty*34;
      setTimeout(()=>{
        if(destroyed || !ball) return;
        ball.style.left = leftPct+'%'; ball.style.bottom = bottomPct+'%';
        ball.style.transform = 'translate(-50%,0) scale('+(shot.chip?0.85:0.7)+') rotate(360deg)';
      }, 60);
      setTimeout(()=>{
        if(destroyed) return;
        if(shot.wide){ setBanner('😬 تسديدة خارج المرمى!', '#f87171'); sfx('wrong'); }
        else if(scored){ setBanner('⚽ GOAL! هدف!', '#4ade80'); sfx('win'); }
        else { setBanner('🧤 تصدي رائع من الحارس!', '#f87171'); sfx('hit'); }
        cb();
      }, 680);
    }

    /* ---------- turn engine (runs for ai / local / online-host) ---------- */
    function kicker(idx){ return idx%2===0 ? 'A' : 'B'; }
    function decideStatus(){
      if(kickIndex===10){ if(scoreA!==scoreB) return { over:true, winner: scoreA>scoreB?'A':'B' }; return { over:false }; }
      if(kickIndex>10 && (kickIndex-10)%2===0){ if(scoreA!==scoreB) return { over:true, winner: scoreA>scoreB?'A':'B' }; }
      return { over:false };
    }

    function getInput(side, kind, cb){
      if(destroyed) return;
      if(mode==='ai'){
        if(side==='A'){ if(kind==='shot') showKickerUI('أنت', cb); else showDefendUI('أنت', cb); }
        else {
          clearControlZone();
          setBanner(kind==='shot' ? '🤖 الجهاز يستعد للتسديد...' : '🤖 الجهاز يستعد للصد...', '#94a3b8');
          setTimeout(()=>{ if(!destroyed) cb(kind==='shot' ? pkAiShot() : pkAiDive()); }, 700+Math.random()*500);
        }
      } else if(mode==='local'){
        const lbl = side==='A' ? labelA : labelB;
        showPassDevice(lbl, kind, ()=>{ if(kind==='shot') showKickerUI(lbl, cb); else showDefendUI(lbl, cb); });
      } else if(mode==='online'){
        if(side==='A'){ if(kind==='shot') showKickerUI(labelA, cb); else showDefendUI(labelA, cb); }
        else {
          send({ type: kind==='shot' ? 'yourTurnKick' : 'yourTurnDefend' });
          clearControlZone();
          setBanner(kind==='shot' ? ('⏳ '+labelB+' يسدد الآن...') : ('⏳ '+labelB+' يستعد للصد...'), '#94a3b8');
          if(kind==='shot') pendingResolvers.shot = cb; else pendingResolvers.dive = cb;
        }
      }
    }

    function applyResult(kSide, shot, dive, result){
      const scored = result.scored;
      if(kSide==='A'){ attemptsA++; if(scored) scoreA++; dotsA.push(scored?'goal':'miss'); }
      else { attemptsB++; if(scored) scoreB++; dotsB.push(scored?'goal':'miss'); }
      updateHud();
      animateAndShow(shot, dive, scored, kSide, ()=>{
        if(destroyed) return;
        if(mode==='online' && isHost) send({ type:'kickResult', shot, dive, scored, kSide, scoreA, scoreB, attemptsA, attemptsB, dotsA, dotsB });
        kickIndex++;
        const status = decideStatus();
        if(status.over){
          matchOver=true;
          if(mode==='online' && isHost) send({ type:'matchOver', winner:status.winner, scoreA, scoreB });
          setTimeout(()=>{ if(!destroyed) showFinal(status.winner); }, 700);
        } else {
          setTimeout(()=>{ if(!destroyed) runTurn(); }, 900);
        }
      });
    }

    function runTurn(){
      if(destroyed || matchOver) return;
      const kSide=kicker(kickIndex), dSide= kSide==='A' ? 'B' : 'A';
      getInput(kSide, 'shot', shot=>{
        getInput(dSide, 'dive', dive=>{
          const result = pkComputeOutcome(shot, dive);
          applyResult(kSide, shot, dive, result);
        });
      });
    }

    function showFinal(winner){
      clearControlZone();
      const winLabel = winner==='A' ? labelA : labelB;
      const overlayDiv=document.createElement('div'); overlayDiv.className='roundOverlay';
      overlayDiv.innerHTML = '<h2>🏆 فاز '+winLabel+'!</h2><p>النتيجة النهائية: '+teamA.name+' '+scoreA+' - '+scoreB+' '+teamB.name+'</p>';
      const b1=document.createElement('button'); b1.className='actionBtn'; b1.textContent='🔁 مباراة جديدة';
      b1.addEventListener('click', ()=>{ overlayDiv.remove(); if(mode==='online' && peer){ try{peer.destroy();}catch(e){} peer=null; conn=null; } showModeSelect(); });
      const b2=document.createElement('button'); b2.className='actionBtn secondary'; b2.textContent='🏠 القائمة';
      b2.addEventListener('click', ()=>{ overlayDiv.remove(); backBtn.click(); });
      overlayDiv.appendChild(b1); overlayDiv.appendChild(b2);
      sfx('win');
      const stage=document.getElementById('pkStage') || container;
      stage.appendChild(overlayDiv);
    }

    return function cleanup(){
      destroyed=true;
      if(peer){ try{ peer.destroy(); }catch(e){} }
      peer=null; conn=null;
    };
  }

})();
</script>
</body>
</html>
